        </div>

    </header>

    <div class="container">

      <div class="form-section">

          <form id="cadastro_disciplina" action="cadastro_disciplina.php" method="post">

              <h2>Cadastro Disciplina</h2>

              <div class=" form-label">

                  <div class="form-input">
                    <label for="name_Disciplina">Nome da Disciplina</label>
                    <input type="text" name="name_Disciplina" id="name_Disciplina" placeholder="Disciplina"  />
                    <span id="error-name_disciplina" class="error-message"></span>
                  </div>

                  <div class="form-input">
                    <label for="name_Professor">Nome do Professor</label>         
                    <input type="text" name="name_Professor" id="name_Professor" placeholder="Professor"  />
                    <span id="error-name_professor" class="error-message"></span>
                  </div>
                  
                  <div class="form-input">
                      <label for="carga_horaria">Carga Horária</label>
                      <input type="number" name="carga_horaria" id="carga_horaria" min="40" max="320" placeholder="Horas"  />
                      <span id="error-carga_horaria" class="error-message"></span>
                  </div>

                  <div class="form-option">

                      <label for="name_option">Turno</label>
                        <select id="name_option" name="name_option">
                            <option 
                              value="">Selecione:</option>
                              <option value="matutino">Matutino</option>
                              <option value="vespertino">Vespertino</option>
                              <option value="noturno">Noturno</option>
                        </select>
                              <span id="error-name_option" class="error-message"></span>
                  </div>


                  <div class="description">
                    <label>Descrição:</label>
                      <textarea id="description_text" name="description_text" rows="8" cols="42" placeholder="Descrição sobre a Disciplina"></textarea>

                  </div>
              
              </div> 
              
              <div class="botao">
               <button type="submit">Cadastrar</button>
               </div>

              <span id="error-global" class="error-message"></span>


          </form>

      </div>

    </div>
