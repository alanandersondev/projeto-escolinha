        </div>

    </header>
<div class="form-wrapper">
    <div class="form-header">Cadastro Pais/Responsáveis</div>
    <div class="form-container">
        <form id="cadastro-form" action="cadastrar.php" method="POST">
            <label for="primeiro-nome">Primeiro Nome:</label>
            <input type="text" id="primeiro-nome" name="primeiro_nome" required>

            <label for="ultimo-nome">Último Nome:</label>
            <input type="text" id="ultimo-nome" name="ultimo_nome" required>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(xx) xxxxx-xxxx" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>

            <label for="data-nascimento">Data de Nascimento:</label>
            <input type="date" id="data-nascimento" name="data_nascimento" required>

            <label for="responsavel">Responsável por:</label>
            <input type="text" id="responsavel" name="responsavel" required>

            <div class="gender-container">
                <label><input type="radio" name="genero" value="masculino"> Masculino</label>
                <label><input type="radio" name="genero" value="feminino"> Feminino</label>
                <label><input type="radio" name="genero" value="outro"> Outro</label>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</div>
